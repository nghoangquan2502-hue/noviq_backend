
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thêm danh mục sản phẩm</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .header {
            background: #212529;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .required {
            color: #dc3545;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 11px 17px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-save {
            background: #198754;
        }

        .btn-cancel {
            background: #6c757d;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            background: #f8d7da;
            color: #842029;
        }

        .footer {
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 18px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Quản trị cửa hàng đồ gia dụng</h1>
    </header>

    <main class="container">

        <div class="card">
            <h2>Thêm danh mục sản phẩm</h2>

            <!-- Hiển thị thông báo lỗi từ Flask -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <!-- Gửi dữ liệu đến route add_category bằng POST -->
            <form method="POST"
                  action="{{ url_for('add_category') }}">

                <div class="form-group">
                    <label for="category_name">
                        Tên danh mục <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="category_name"
                        name="category_name"
                        maxlength="100"
                        placeholder="Ví dụ: Đồ dùng nhà bếp"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Mô tả danh mục</label>

                    <textarea
                        id="description"
                        name="description"
                        maxlength="255"
                        placeholder="Nhập mô tả cho danh mục (không bắt buộc)"
                    ></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-save">
                        Lưu danh mục
                    </button>

                    <a href="{{ url_for('admin_categories') }}"
                       class="btn btn-cancel">
                        Hủy
                    </a>
                </div>

            </form>
        </div>

        <div class="footer">
            <a href="{{ url_for('admin_categories') }}">
                ← Quay lại danh sách danh mục
            </a>
        </div>

    </main>

</body>
</html>
