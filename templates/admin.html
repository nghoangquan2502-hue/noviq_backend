
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị hệ thống | Đồ Gia Dụng</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #263238;
        }

        a {
            text-decoration: none;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Thanh menu bên trái */
        .sidebar {
            width: 250px;
            background: #172554;
            color: white;
            padding: 25px 16px;
            flex-shrink: 0;
        }

        .brand {
            font-size: 21px;
            font-weight: bold;
            padding: 8px 10px 25px;
            border-bottom: 1px solid #334155;
            margin-bottom: 25px;
        }

        .brand span {
            color: #fbbf24;
        }

        .menu-title {
            font-size: 12px;
            color: #a5b4fc;
            margin: 20px 10px 10px;
            text-transform: uppercase;
        }

        .menu a {
            display: block;
            color: #e2e8f0;
            padding: 13px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .menu a:hover,
        .menu a.active {
            background: #334155;
            color: #ffffff;
        }

        .menu a span {
            margin-right: 9px;
        }

        /* Nội dung chính */
        .main {
            flex: 1;
            min-width: 0;
        }

        .topbar {
            background: #ffffff;
            min-height: 75px;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        .topbar h1 {
            font-size: 23px;
        }

        .admin-info {
            color: #64748b;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #64748b;
            line-height: 1.6;
        }

        /* Các thẻ thống kê */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
            border-left: 4px solid #2563eb;
        }

        .stat-card:nth-child(2) {
            border-left-color: #16a34a;
        }

        .stat-card:nth-child(3) {
            border-left-color: #f59e0b;
        }

        .stat-label {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: bold;
            color: #172554;
        }

        /* Các chức năng */
        .section {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
            margin-bottom: 25px;
        }

        .section h3 {
            font-size: 19px;
            margin-bottom: 8px;
        }

        .section-description {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .action-card {
            display: block;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            color: #1e293b;
            transition: 0.2s;
        }

        .action-card:hover {
            border-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.08);
        }

        .action-card .icon {
            font-size: 27px;
            margin-bottom: 12px;
        }

        .action-card h4 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .action-card p {
            font-size: 13px;
            line-height: 1.6;
            color: #64748b;
        }

        /* Nút */
        .btn {
            display: inline-block;
            border: none;
            border-radius: 7px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-blue {
            background: #2563eb;
            color: white;
        }

        .btn-blue:hover {
            background: #1d4ed8;
        }

        .btn-red {
            background: #fee2e2;
            color: #b91c1c;
        }

        .btn-red:hover {
            background: #fecaca;
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer {
            padding: 20px 30px;
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .sidebar {
                width: 210px;
            }
        }

        @media (max-width: 600px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .menu {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 5px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
                padding: 18px;
            }

            .content {
                padding: 18px;
            }

            .action-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
